[package]
name = "agent-scripts"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
description = "Agent scripts: saved agent calls as Markdown with frontmatter, and the runner shared by poimen and Nixe"
license = "MIT"
repository = "https://github.com/GravionLabs/agent-scripts"
publish = false

[lib]
name = "agent_scripts"
path = "src/lib.rs"

[[bin]]
name = "agent-scripts"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
